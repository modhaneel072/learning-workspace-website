name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          # e.g. "/learning-workspace-website" and "https://<user>.github.io/learning-workspace-website"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional. Set the repository variable EARLY_ACCESS_ENDPOINT to connect the form.
          NEXT_PUBLIC_EARLY_ACCESS_ENDPOINT: ${{ vars.EARLY_ACCESS_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
